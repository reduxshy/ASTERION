site_name: ASTERION Wiki
site_description: Официальная база знаний Minecraft-сервера ASTERION
# Проверьте: адрес должен совпадать с реальным адресом сайта и именем репозитория
site_url: https://reduxshy.github.io/ASTERION/
repo_url: https://github.com/reduxshy/ASTERION
repo_name: reduxshy/ASTERION

theme:
  name: material
  language: ru
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - content.code.copy
  # Одна тёмная палитра: CSS рассчитан только на неё
  palette:
    scheme: slate
    primary: black
    accent: deep purple

nav:
  - Главная: index.md
  - Начало игры:
      - Подключение: getting-started/connect.md
  - Правила:
      - Обзор правил: rules/index.md
      - Запрещённые моды: rules/forbidden-mods.md
  - Справочник:
      - Обзор: guide/index.md
      - Команды: guide/commands.md
      - Новые крафты: guide/crafts.md
  - Поддержка:
      - Сообщество и помощь: community/index.md

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: false
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
